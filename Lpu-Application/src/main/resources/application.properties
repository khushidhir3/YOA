# ==========================================
# Task Manager - Application Configuration
# ==========================================

spring.application.name=taskmanager

# ------------------------------------------
# H2 Persistent File Database
# ------------------------------------------
spring.datasource.url=jdbc:h2:file:${H2_FILE_PATH:./data/taskmanagerdb};DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (disable in prod via env var override)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ------------------------------------------
# Thymeleaf
# ------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------
# Server
# ------------------------------------------
server.port=${PORT:8080}
server.error.whitelabel.enabled=false

# ------------------------------------------
# JWT Configuration
# ------------------------------------------
jwt.secret=${JWT_SECRET:taskmanager-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
jwt.expiration.ms=86400000

# ------------------------------------------
# Spring Boot Actuator
# ------------------------------------------
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

info.app.name=Task Manager
info.app.description=A full-featured Task Management System
info.app.version=1.0.0
info.app.java-version=17

# ------------------------------------------
# Logging
# ------------------------------------------
logging.level.com.taskmanager=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n