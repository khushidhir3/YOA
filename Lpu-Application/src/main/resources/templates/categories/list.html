<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Categories — TaskFlow</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="page-header">
            <div>
                <h1 class="page-title">Categories</h1>
                <p class="page-subtitle">Organize your tasks with color-coded categories</p>
            </div>
            <a href="/categories/new" class="btn btn-primary">+ New Category</a>
        </div>

        <div class="page-body">
            <div th:if="${categories.empty}" class="empty-state">
                <div class="empty-state-icon">◈</div>
                <div class="empty-state-title">No categories yet</div>
                <div class="empty-state-desc">Create categories to organize your tasks efficiently.</div>
                <a href="/categories/new" class="btn btn-primary">+ Create Category</a>
            </div>

            <div th:if="${!categories.empty}"
                 style="display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px;">
                <div th:each="cat : ${categories}" class="card" style="display:flex; align-items:center; gap:16px; padding:20px;">
                    <div style="width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;"
                         th:style="'background:' + ${cat.color} + '22; width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;'">
                        <span style="width:18px; height:18px; border-radius:50%; display:block;"
                              th:style="'background:' + ${cat.color} + '; width:18px; height:18px; border-radius:50%; display:block;'"></span>
                    </div>
                    <div style="flex:1; overflow:hidden;">
                        <div class="font-bold" style="font-size:15px; margin-bottom:2px;" th:text="${cat.name}">Category</div>
                        <div class="text-muted text-xs" th:text="${cat.user == null ? 'System' : 'Your category'}"></div>
                    </div>
                    <div class="flex gap-2" th:if="${cat.user != null}">
                        <a th:href="@{/categories/{id}/edit(id=${cat.id})}" class="btn btn-sm btn-secondary">Edit</a>
                        <form th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post"
                              data-confirm="Delete this category?">
                            <button type="submit" class="btn btn-sm btn-danger">Del</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
