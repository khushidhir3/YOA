<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${editMode} ? 'Edit Task — TaskFlow' : 'New Task — TaskFlow'">Task Form</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="page-header">
            <div>
                <a th:href="${editMode} ? '/tasks/' + ${taskId} : '/tasks'" class="btn btn-secondary btn-sm" style="margin-bottom:12px;">← Back</a>
                <h1 class="page-title" th:text="${editMode} ? 'Edit Task' : 'Create New Task'">Task Form</h1>
                <p class="page-subtitle" th:text="${editMode} ? 'Update the task details below' : 'Fill in the details to create a new task'"></p>
            </div>
        </div>

        <div class="page-body">
            <div class="card" style="max-width:760px;">
                <form th:action="${editMode} ? '/tasks/' + ${taskId} + '/edit' : '/tasks/new'"
                      method="post"
                      th:object="${taskRequest}">

                    <div class="form-group">
                        <label class="form-label" for="title">Task Title *</label>
                        <input type="text" id="title" name="title" class="form-control"
                               th:value="*{title}" placeholder="Enter a clear, descriptive title" required maxlength="200"/>
                        <div th:if="${#fields.hasErrors('title')}" class="form-error" th:errors="*{title}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="description">Description</label>
                        <textarea id="description" name="description" class="form-control" rows="4"
                                  placeholder="Add more details about this task..." th:text="*{description}"></textarea>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label class="form-label" for="priority">Priority</label>
                            <select id="priority" name="priority" class="form-control">
                                <option th:each="p : ${priorities}"
                                        th:value="${p}"
                                        th:text="${p.name()}"
                                        th:selected="${p == taskRequest.priority}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="status">Status</label>
                            <select id="status" name="status" class="form-control">
                                <option th:each="s : ${statuses}"
                                        th:value="${s}"
                                        th:text="${s.name().replace('_',' ')}"
                                        th:selected="${s == taskRequest.status}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label class="form-label" for="dueDate">Due Date</label>
                            <input type="date" id="dueDate" name="dueDate" class="form-control"
                                   th:value="${taskRequest.dueDate}"/>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="categoryId">Category</label>
                            <select id="categoryId" name="categoryId" class="form-control">
                                <option value="">No Category</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}"
                                        th:selected="${cat.id == taskRequest.categoryId}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- Tags -->
                    <div class="form-group">
                        <label class="form-label" for="tag-input">Tags <span class="text-muted text-xs">(press Enter to add)</span></label>
                        <input type="hidden" id="tags-hidden" name="tags"
                               th:value="${#strings.listJoin(taskRequest.tags, ',')}"/>
                        <div id="tags-container" class="form-control" style="display:flex; flex-wrap:wrap; gap:6px; min-height:44px; height:auto; align-items:center;">
                            <input id="tag-input" type="text" placeholder="Add a tag..."
                                   style="border:none; background:transparent; color:var(--text-primary); outline:none; min-width:120px; flex:1; font-family:inherit; font-size:14px;"/>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg"
                                th:text="${editMode} ? 'Update Task' : 'Create Task'">Create</button>
                        <a th:href="${editMode} ? '/tasks/' + ${taskId} : '/tasks'"
                           class="btn btn-secondary btn-lg">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
