<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${editMode} ? 'Edit Task — Admin' : 'New Task — Admin'">Admin Task Form</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="page-header">
            <div>
                <a href="/admin/tasks" class="btn btn-secondary btn-sm" style="margin-bottom:12px;">← Back</a>
                <h1 class="page-title" th:text="${editMode} ? 'Edit Task' : 'Create Task'">Task Form</h1>
                <p class="page-subtitle">Admin can assign tasks to any user</p>
            </div>
        </div>

        <div class="page-body">
            <div class="card" style="max-width:800px;">
                <form th:action="${editMode} ? '/admin/tasks/' + ${taskId} + '/edit' : '/admin/tasks/new'"
                      method="post" th:object="${taskRequest}">

                    <div class="form-group">
                        <label class="form-label" for="title">Task Title *</label>
                        <input type="text" id="title" name="title" class="form-control"
                               th:value="*{title}" required maxlength="200" placeholder="Descriptive task title"/>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="description">Description</label>
                        <textarea id="description" name="description" class="form-control" rows="4"
                                  placeholder="Detailed task description..." th:text="*{description}"></textarea>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label class="form-label">Priority</label>
                            <select name="priority" class="form-control">
                                <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.name()}"
                                        th:selected="${p == taskRequest.priority}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-control">
                                <option th:each="s : ${statuses}" th:value="${s}"
                                        th:text="${s.name().replace('_',' ')}"
                                        th:selected="${s == taskRequest.status}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label class="form-label">Due Date</label>
                            <input type="date" name="dueDate" class="form-control" th:value="*{dueDate}"/>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Category</label>
                            <select name="categoryId" class="form-control">
                                <option value="">No Category</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}"
                                        th:text="${cat.name}" th:selected="${cat.id == taskRequest.categoryId}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Assign To</label>
                        <select name="assignedToId" class="form-control">
                            <option value="">Unassigned</option>
                            <option th:each="user : ${users}"
                                    th:value="${user.id}"
                                    th:text="${user.fullName != null ? user.fullName + ' (@' + user.username + ')' : user.username}"
                                    th:selected="${user.id == taskRequest.assignedToId}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tags <span class="text-muted text-xs">(Enter to add)</span></label>
                        <input type="hidden" id="tags-hidden" name="tags"
                               th:value="${#strings.listJoin(taskRequest.tags, ',')}"/>
                        <div id="tags-container" class="form-control"
                             style="display:flex; flex-wrap:wrap; gap:6px; min-height:44px; height:auto; align-items:center;">
                            <input id="tag-input" type="text" placeholder="Add a tag..."
                                   style="border:none; background:transparent; color:var(--text-primary); outline:none; min-width:120px; flex:1; font-family:inherit; font-size:14px;"/>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg"
                                th:text="${editMode} ? 'Update Task' : 'Create Task'">Create</button>
                        <a href="/admin/tasks" class="btn btn-secondary btn-lg">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
