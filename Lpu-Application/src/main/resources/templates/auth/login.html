<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In — Task Manager</title>
    <meta name="description" content="Sign in to your Task Manager account"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-icon">✓</div>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to your TaskFlow account</p>
        </div>

        <div th:if="${success}" class="alert alert-success" data-auto-dismiss="true">✓ <span th:text="${success}"></span></div>
        <div th:if="${error}" class="alert alert-danger">✗ <span th:text="${error}"></span></div>

        <form th:action="@{/auth/login}" method="post" th:object="${loginRequest}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Enter your username" autocomplete="username" required autofocus/>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Enter your password" autocomplete="current-password" required/>
            </div>
            <button type="submit" class="btn btn-primary w-full btn-lg" style="width:100%; justify-content:center; margin-top:8px;">
                Sign In →
            </button>
        </form>

        <p style="text-align:center; margin-top:24px; font-size:14px; color:var(--text-secondary);">
            Don't have an account?
            <a th:href="@{/auth/register}" style="color:var(--accent-primary); font-weight:600;">Create one free</a>
        </p>

        <div style="margin-top:24px; padding:16px; background:rgba(99,102,241,0.07); border-radius:12px; border:1px solid var(--border-color);">
            <p style="font-size:12px; color:var(--text-muted); text-align:center; margin-bottom:8px;">Demo Credentials</p>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:12px;">
                <div style="padding:8px; background:rgba(239,68,68,0.08); border-radius:8px; color:var(--text-secondary);">
                    <div style="font-weight:700; color:var(--danger); margin-bottom:2px;">Admin</div>
                    <div>admin / Admin@123</div>
                </div>
                <div style="padding:8px; background:rgba(99,102,241,0.08); border-radius:8px; color:var(--text-secondary);">
                    <div style="font-weight:700; color:var(--accent-primary); margin-bottom:2px;">User</div>
                    <div>alice / User@123</div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
