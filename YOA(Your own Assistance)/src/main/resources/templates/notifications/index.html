<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Notifications — TaskFlow</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="page-header">
            <div>
                <h1 class="page-title">🔔 Notifications</h1>
                <p class="page-subtitle">Stay updated on your tasks and activity</p>
            </div>
            <form th:if="${!notifications.empty}" th:action="@{/notifications/mark-all-read}" method="post">
                <button type="submit" class="btn btn-secondary">✓ Mark All Read</button>
            </form>
        </div>

        <div class="page-body">
            <div class="card" style="padding:0; overflow:hidden;">
                <div th:if="${notifications.empty}" class="empty-state">
                    <div class="empty-state-icon">🔔</div>
                    <div class="empty-state-title">No notifications yet</div>
                    <div class="empty-state-desc">You'll be notified when tasks are assigned or commented on.</div>
                </div>

                <div th:each="notif : ${notifications}"
                     th:classappend="${!notif.read} ? 'unread' : ''"
                     class="notification-item">

                    <div class="notif-icon"
                         th:switch="${notif.type}"
                         style="background:rgba(99,102,241,0.15);">
                        <span th:case="'TASK_ASSIGNED'">🎯</span>
                        <span th:case="'COMMENT_ADDED'">💬</span>
                        <span th:case="'WARNING'">⚠</span>
                        <span th:case="*">ℹ</span>
                    </div>

                    <div style="flex:1;">
                        <div class="notif-message" th:text="${notif.message}"></div>
                        <div class="notif-time"
                             th:text="${#temporals.format(notif.createdAt, 'dd MMM yyyy · HH:mm')}"></div>
                    </div>

                    <div class="flex gap-2 items-center">
                        <span th:if="${!notif.read}" class="unread-dot"></span>
                        <a th:if="${notif.relatedTaskId != null}"
                           th:href="@{/tasks/{id}(id=${notif.relatedTaskId})}"
                           class="btn btn-sm btn-secondary">View</a>
                        <form th:action="@{/notifications/{id}/read(id=${notif.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-secondary" th:if="${!notif.read}">Mark Read</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
