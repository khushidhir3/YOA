<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create Account — Task Manager</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-card" style="max-width:480px;">
        <div class="auth-logo">
            <div class="auth-logo-icon">✦</div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join TaskFlow and get organized today</p>
        </div>

        <div th:if="${error}" class="alert alert-danger">✗ <span th:text="${error}"></span></div>
        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
            ✗ Please fix the errors below:
            <ul style="margin-top:4px; margin-bottom:0; padding-left:20px;">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
            </ul>
        </div>

        <form th:action="@{/auth/register}" method="post" th:object="${registerRequest}">
            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control"
                           th:value="${registerRequest?.username}"
                           placeholder="yourname" required autofocus
                           minlength="3" maxlength="50"/>
                    <div th:if="${#fields.hasErrors('username')}" class="form-error"
                         th:errors="*{username}"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" class="form-control"
                           th:value="${registerRequest?.fullName}"
                           placeholder="Your Full Name" required maxlength="100"/>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control"
                       th:value="${registerRequest?.email}"
                       placeholder="you@example.com" required/>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="At least 6 characters" required minlength="6"/>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%; justify-content:center; margin-top:8px;">
                Create Account →
            </button>
        </form>

        <p style="text-align:center; margin-top:24px; font-size:14px; color:var(--text-secondary);">
            Already have an account?
            <a th:href="@{/auth/login}" style="color:var(--accent-primary); font-weight:600;">Sign in</a>
        </p>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
