<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' — Task Manager' : 'Task Manager'}">Task Manager</title>
    <meta name="description" th:content="${pageDescription ?: 'Task Management System'}"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-layout">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">✓</div>
            <div>
                <div class="logo-text">TaskFlow</div>
                <div class="logo-sub">
                    <span sec:authorize="hasRole('ADMIN')">Admin Portal</span>
                    <span sec:authorize="hasRole('USER') and !hasRole('ADMIN')">My Workspace</span>
                </div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <!-- User Nav -->
            <sec:authorize access="isAuthenticated()">
                <div class="nav-section-label">Workspace</div>

                <a href="/dashboard" class="nav-item">
                    <span class="nav-icon">⊞</span>
                    <span>Dashboard</span>
                </a>
                <a href="/tasks" class="nav-item">
                    <span class="nav-icon">☑</span>
                    <span>My Tasks</span>
                </a>
                <a href="/categories" class="nav-item">
                    <span class="nav-icon">◈</span>
                    <span>Categories</span>
                </a>
                <a href="/notifications" class="nav-item">
                    <span class="nav-icon">🔔</span>
                    <span>Notifications</span>
                    <span id="notif-badge" class="nav-badge" style="display:none;"></span>
                </a>

                <!-- Admin Nav -->
                <sec:authorize access="hasRole('ADMIN')">
                    <div class="nav-section-label" style="margin-top:12px;">Admin Portal</div>
                    <a href="/admin/tasks" class="nav-item">
                        <span class="nav-icon">⊛</span>
                        <span>All Tasks</span>
                        <span class="admin-portal-badge">Admin</span>
                    </a>
                    <a href="/admin/users" class="nav-item">
                        <span class="nav-icon">👥</span>
                        <span>Users</span>
                        <span class="admin-portal-badge">Admin</span>
                    </a>
                    <a href="/admin/audit" class="nav-item">
                        <span class="nav-icon">📋</span>
                        <span>Audit Log</span>
                        <span class="admin-portal-badge">Admin</span>
                    </a>
                    <a href="/admin/actuator-dashboard" class="nav-item">
                        <span class="nav-icon">⚙</span>
                        <span>System Health</span>
                        <span class="admin-portal-badge">Admin</span>
                    </a>
                    <a href="/h2-console" target="_blank" class="nav-item">
                        <span class="nav-icon">🗄</span>
                        <span>H2 Console</span>
                        <span class="admin-portal-badge">Admin</span>
                    </a>
                </sec:authorize>
            </sec:authorize>
        </nav>

        <!-- User profile footer -->
        <sec:authorize access="isAuthenticated()">
            <div class="sidebar-user">
                <div class="user-avatar"
                     th:text="${currentUser?.fullName != null ? currentUser.fullName.substring(0,1).toUpperCase() : #authentication.name.substring(0,1).toUpperCase()}">A</div>
                <div class="user-info">
                    <div class="user-name" th:text="${currentUser?.fullName ?: #authentication.name}">User</div>
                    <div class="user-role" sec:authorize="hasRole('ADMIN')">Administrator</div>
                    <div class="user-role" sec:authorize="hasRole('USER') and !hasRole('ADMIN')">Team Member</div>
                </div>
                <form th:action="@{/auth/logout}" method="post" style="margin:0;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}"/>
                    <button type="submit" class="logout-btn" title="Logout">⇥</button>
                </form>
            </div>
        </sec:authorize>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">
        <!-- Flash messages -->
        <div th:if="${success}" class="alert alert-success" data-auto-dismiss="true"
             style="margin: 16px 40px 0; position: relative;">
            ✓ <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" data-auto-dismiss="true"
             style="margin: 16px 40px 0;">
            ✗ <span th:text="${error}"></span>
        </div>
        <div th:if="${warning}" class="alert alert-warning" data-auto-dismiss="true"
             style="margin: 16px 40px 0;">
            ⚠ <span th:text="${warning}"></span>
        </div>

        <!-- Page fragment slot -->
        <div th:replace="${content}">
            <!-- Content injected here -->
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
