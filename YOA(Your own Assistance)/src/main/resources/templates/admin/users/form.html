<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit User — Admin — TaskFlow</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="page-header">
            <div>
                <a href="/admin/users" class="btn btn-secondary btn-sm" style="margin-bottom:12px;">← Back</a>
                <h1 class="page-title">Edit User <span class="admin-portal-badge">Admin</span></h1>
                <p class="page-subtitle" th:text="'Editing: @' + ${userResponse.username}"></p>
            </div>
        </div>

        <div class="page-body">
            <div class="card" style="max-width:560px;">
                <form th:action="@{/admin/users/{id}/edit(id=${userResponse.id})}"
                      method="post" th:object="${userUpdateRequest}">

                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="fullName" class="form-control"
                               th:value="${userResponse.fullName}" placeholder="Full name"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control"
                               th:value="${userResponse.email}" placeholder="Email address"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">New Password <span class="text-muted text-xs">(leave blank to keep)</span></label>
                        <input type="password" name="password" class="form-control" placeholder="New password (min 6 chars)"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Role</label>
                        <select name="roleName" class="form-control">
                            <option value="">— Keep current role —</option>
                            <option value="ROLE_USER"
                                    th:selected="${userResponse.roles.contains('ROLE_USER') and !userResponse.roles.contains('ROLE_ADMIN')}">
                                Regular User
                            </option>
                            <option value="ROLE_ADMIN"
                                    th:selected="${userResponse.roles.contains('ROLE_ADMIN')}">
                                Administrator
                            </option>
                        </select>
                    </div>

                    <div class="flex gap-3 mt-4">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="/admin/users" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
