<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>System Health — Admin — TaskFlow</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="page-header">
            <div>
                <h1 class="page-title">System Health <span class="admin-portal-badge">Admin</span></h1>
                <p class="page-subtitle">Spring Boot Actuator metrics and health status</p>
            </div>
            <a th:href="${actuatorBase + '/health'}" target="_blank" class="btn btn-secondary">Raw Actuator →</a>
        </div>

        <div class="page-body">
            <div th:if="${actuatorError}" class="alert alert-warning" th:text="${actuatorError}"></div>

            <!-- Health Card -->
            <div class="actuator-grid" th:if="${health != null}">
                <div class="actuator-card">
                    <div class="chart-title mb-3">❤ Application Health</div>
                    <div th:if="${health.status == 'UP'}"
                         style="display:inline-flex; align-items:center; gap:8px; color:var(--success); font-size:20px; font-weight:700; margin-bottom:12px;">
                        <span style="width:12px;height:12px;border-radius:50%;background:var(--success);display:inline-block;"></span>
                        UP
                    </div>
                    <div th:if="${health.status != 'UP'}"
                         style="color:var(--danger); font-size:20px; font-weight:700; margin-bottom:12px;"
                         th:text="${health.status}">DOWN</div>
                    <div class="actuator-value" th:text="${health}"></div>
                </div>

                <!-- Info Card -->
                <div class="actuator-card" th:if="${info != null}">
                    <div class="chart-title mb-3">ℹ Application Info</div>
                    <div class="actuator-value" th:text="${info}"></div>
                </div>
            </div>

            <!-- Quick Links to Actuator endpoints -->
            <div class="card mt-4">
                <div class="chart-title mb-3">⚙ Actuator Endpoints</div>
                <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px;">
                    <a th:each="ep : ${ {'health', 'info', 'metrics', 'env', 'beans', 'loggers', 'mappings', 'conditions', 'configprops', 'threaddump'} }"
                       th:href="${actuatorBase + '/' + ep}"
                       target="_blank"
                       class="btn btn-secondary"
                       style="justify-content:flex-start; font-family:monospace;"
                       th:text="${'/actuator/' + ep}"></a>
                </div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
