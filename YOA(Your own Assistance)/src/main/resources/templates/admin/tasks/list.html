<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>All Tasks — Admin — TaskFlow</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="page-header">
            <div>
                <h1 class="page-title">All Tasks <span class="admin-portal-badge">Admin</span></h1>
                <p class="page-subtitle">System-wide task management</p>
            </div>
            <a href="/admin/tasks/new" class="btn btn-primary">+ Create Task</a>
        </div>

        <div class="page-body">
            <form method="get" action="/admin/tasks" class="filters-bar">
                <div class="filter-group" style="flex:2; min-width:200px;">
                    <label>🔍 Search</label>
                    <input type="text" name="search" th:value="${searchFilter}" placeholder="Search task titles..."/>
                </div>
                <div class="filter-group">
                    <label>Status</label>
                    <select name="status">
                        <option value="">All</option>
                        <option th:each="s : ${statuses}" th:value="${s}"
                                th:text="${s.name().replace('_',' ')}"
                                th:selected="${s == statusFilter}"></option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Priority</label>
                    <select name="priority">
                        <option value="">All</option>
                        <option th:each="p : ${priorities}" th:value="${p}"
                                th:text="${p.name()}"
                                th:selected="${p == priorityFilter}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-secondary" style="align-self:flex-end;">Filter</button>
                <a href="/admin/tasks" class="btn btn-secondary" style="align-self:flex-end;">Reset</a>
            </form>

            <div th:if="${tasks.empty}" class="empty-state">
                <div class="empty-state-icon">⊛</div>
                <div class="empty-state-title">No tasks found</div>
            </div>

            <div th:if="${!tasks.empty}" class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Task</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Created By</th>
                            <th>Assigned To</th>
                            <th>Due Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="task : ${tasks}" th:classappend="${task.overdue} ? 'overdue-row' : ''">
                            <td class="text-muted text-xs" th:text="${task.id}"></td>
                            <td>
                                <a th:href="@{/tasks/{id}(id=${task.id})}" class="task-title-link">
                                    <span th:text="${task.title}"></span>
                                </a>
                            </td>
                            <td>
                                <span th:class="'badge badge-' + ${task.priority.name().toLowerCase()}"
                                      th:text="${task.priority.name()}"></span>
                            </td>
                            <td>
                                <span th:switch="${task.status.name()}">
                                    <span th:case="'TODO'" class="badge badge-todo">To Do</span>
                                    <span th:case="'IN_PROGRESS'" class="badge badge-in-progress">In Progress</span>
                                    <span th:case="'DONE'" class="badge badge-done">Done</span>
                                </span>
                            </td>
                            <td class="text-sm text-secondary" th:text="${task.createdByUsername}"></td>
                            <td class="text-sm" th:text="${task.assignedToUsername ?: '—'}"></td>
                            <td>
                                <span th:if="${task.dueDate != null}"
                                      th:text="${task.dueDate}"
                                      th:class="${task.overdue} ? 'text-danger text-sm' : 'text-sm text-secondary'"></span>
                                <span th:if="${task.dueDate == null}" class="text-muted text-sm">—</span>
                            </td>
                            <td>
                                <div class="flex gap-2">
                                    <a th:href="@{/admin/tasks/{id}/edit(id=${task.id})}" class="btn btn-sm btn-secondary">Edit</a>
                                    <form th:action="@{/admin/tasks/{id}/delete(id=${task.id})}" method="post"
                                          data-confirm="Delete this task?">
                                        <button type="submit" class="btn btn-sm btn-danger">Del</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
